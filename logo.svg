<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f766e" opacity="0.1" stroke="#0f766e" stroke-width="2"/>
  
  <!-- Main shape - stylized solution symbol -->
  <g transform="translate(100, 100)">
    <!-- Checkmark -->
    <path d="M -30 0 L -10 20 L 30 -15" 
          stroke="#0f766e" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Decorative circles -->
    <circle cx="-40" cy="-30" r="8" fill="#14b8a6" opacity="0.7"/>
    <circle cx="40" cy="30" r="8" fill="#14b8a6" opacity="0.7"/>
    <circle cx="20" cy="-40" r="6" fill="#0f766e" opacity="0.5"/>
  </g>
